<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PUENTIX - Icono de ingeniería civil">
  <title>PUENTIX - Icono de ingeniería civil</title>
  <rect x="4" y="4" width="248" height="248" fill="#0A1C2E" stroke="#E75B12" stroke-width="8" rx="0" ry="0" />
  <!-- Bridge deck -->
  <path d="M26 111 H230 V127 H26 Z" fill="#38BDF8" stroke="#38BDF8" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arch -->
  <path d="M36 160 Q128 39 220 160" fill="none" stroke="#38BDF8" stroke-width="7.0" stroke-linecap="round" stroke-linejoin="round" />
