<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MCOEF - Icono de ingeniería civil">
  <title>MCOEF - Icono de ingeniería civil</title>
  <rect x="4" y="4" width="248" height="248" fill="#0A1C2E" stroke="#E75B12" stroke-width="8" rx="0" ry="0" />
  <!-- Continuous beam -->
  <line x1="26" y1="120" x2="230" y2="120" stroke="#38BDF8" stroke-width="7.0" stroke-linecap="round" />
  
  <!-- Moment diagram zero baseline -->
  <line x1="26" y1="126" x2="230" y2="126" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Supports at x = 41, 99, 157, 215 -->
  <!-- Support 1 (Left pin) -->
  <polygon points="41,120 29,140 53,140" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4.0" stroke-linejoin="round" />
  <line x1="23" y1="143" x2="59" y2="143" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Support 2 (Interior) -->
  <polygon points="99,120 87,140 111,140" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4.0" stroke-linejoin="round" />
  <line x1="81" y1="143" x2="117" y2="143" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Support 3 (Interior) -->
  <polygon points="157,120 145,140 169,140" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4.0" stroke-linejoin="round" />
  <line x1="139" y1="143" x2="175" y2="143" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Support 4 (Right roller) -->
  <polygon points="215,120 203,140 227,140" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4.0" stroke-linejoin="round" />
  <circle cx="209" cy="146" r="4.0" fill="#E75B12" stroke="none" stroke-width="0" />
  <circle cx="221" cy="146" r="4.0" fill="#E75B12" stroke="none" stroke-width="0" />
  <line x1="197" y1="152" x2="233" y2="152" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Positive moments in spans (Cyan) -->
  <path d="M 41 126 Q 70 196 99 126 M 99 126 Q 128 196 157 126 M 157 126 Q 186 196 215 126" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Negative moments over interior supports (Orange) -->
  <path d="M 76 126 Q 99 48 122 126 M 134 126 Q 157 48 180 126" fill="none" stroke="#E75B12" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" />
</svg>
