<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="FRAMIX - Icono de ingeniería civil">
  <title>FRAMIX - Icono de ingeniería civil</title>
  <rect x="4" y="4" width="248" height="248" fill="#0A1C2E" stroke="#E75B12" stroke-width="8" rx="0" ry="0" />
  <!-- Pórtico plano no deformado (Cyan institucional) -->
  <path d="M 55 208 V 65 H 201 V 208" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Apoyo empotrado izquierdo (Línea de suelo y rayado reforzado >= 4.0px) -->
  <line x1="37" y1="210" x2="73" y2="210" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="38" y1="210" x2="29" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="47" y1="210" x2="38" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="56" y1="210" x2="47" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="65" y1="210" x2="56" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="74" y1="210" x2="65" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Apoyo empotrado derecho -->
  <line x1="183" y1="210" x2="219" y2="210" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="184" y1="210" x2="175" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="193" y1="210" x2="184" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="202" y1="210" x2="193" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="211" y1="210" x2="202" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  <line x1="220" y1="210" x2="211" y2="221" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" />
  
  <!-- Nudos rígidos monolíticos -->
  <circle cx="55" cy="65" r="6" fill="#FFFFFF" stroke="none" stroke-width="0" />
  <circle cx="201" cy="65" r="6" fill="#FFFFFF" stroke="none" stroke-width="0" />
  
  <!-- Deformada elástica unificada (Curva Bézier cúbica continua, ortogonal y suave en Naranja) -->
  <path d="M 55 208 C 55 152 61.5 113.5 72 78 C 97.2 85.4 108 116 128 116 S 158.8 85.4 184 78 C 194.5 113.5 201 152 201 208" fill="none" stroke="#E75B12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
