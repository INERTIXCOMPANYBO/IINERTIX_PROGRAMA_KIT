<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Marco exterior estandarizado naranja sin curvas -->
  <rect x="4" y="4" width="248" height="248" fill="#0A1C2E" stroke="#E75B12" stroke-width="8" rx="0" ry="0" />

  <!-- ================= 40_CERCHIX: ARMADURA / RETICULADO 2D ================= -->

  <!-- APOYO IZQUIERDO FIJO (Articulación fija alineada a y=194) -->
  <polygon points="36,172 22,194 50,194" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  <line x1="16" y1="194" x2="56" y2="194" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="20" y1="202" x2="28" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="202" x2="40" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="44" y1="202" x2="52" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- APOYO DERECHO MÓVIL (Rodillos alineados al mismo suelo y=194) -->
  <polygon points="220,172 208,187 232,187" fill="#0A1C2E" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  <circle cx="213" cy="191" r="3" fill="#FFFFFF" />
  <circle cx="227" cy="191" r="3" fill="#FFFFFF" />
  <line x1="200" y1="194" x2="240" y2="194" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="204" y1="202" x2="212" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="216" y1="202" x2="224" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="228" y1="202" x2="236" y2="194" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- CORDÓN INFERIOR (Tirante principal en Azul Cian) -->
  <line x1="36" y1="172" x2="220" y2="172" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" />

  <!-- CORDONES SUPERIORES (Pares inclinados de la armadura) -->
  <line x1="36" y1="172" x2="128" y2="88" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" />
  <line x1="220" y1="172" x2="128" y2="88" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" />

  <!-- MONTANTES VERTICALES (Blanco técnico) -->
  <line x1="82" y1="130" x2="82" y2="172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="128" y1="88" x2="128" y2="172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="174" y1="130" x2="174" y2="172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- DIAGONALES EN CELOSÍA HOWE (Blanco técnico) -->
  <line x1="82" y1="130" x2="128" y2="172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="174" y1="130" x2="128" y2="172" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- NUDOS ARTICULADOS (Juntas estructurales circulares) -->
  <circle cx="36" cy="172" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="82" cy="172" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="128" cy="172" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="174" cy="172" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="220" cy="172" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />

  <circle cx="82" cy="130" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="174" cy="130" r="5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />
  <circle cx="128" cy="88" r="5.5" fill="#0A1C2E" stroke="#38BDF8" stroke-width="3" />

  <!-- CARGA PUNTUAL NODAL EN CUMBRERA (Flecha Naranja Ampliada con Punta Afilada) -->
  <!-- Vástago: inicia en y=19 y termina limpio en la base del triángulo y=61 -->
  <line x1="128" y1="19" x2="128" y2="61" stroke="#E75B12" stroke-width="7.5" stroke-linecap="round" />
  <!-- Cabeza de flecha: base de ancho 35 px en y=59, punta afilada perfecta en (128, 83) -->
  <polygon points="128,83 110.5,59 145.5,59" fill="#E75B12" />
</svg>
